openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: GBLOC account sessions and external sign-in providers.
  - name: profiles
    description: Public profiles and profile customization.
  - name: account
    description: Signed-in account overview.
  - name: billing
    description: One-time Basic membership checkout and legacy subscription status.
  - name: reports
    description: Profile reporting and moderation.
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      tags: [auth]
      operationId: getAuthSession
      summary: Get the current GBLOC authentication session
      responses:
        "200":
          description: Current signed-in user, or null when signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionState"
  /auth/logout:
    post:
      tags: [auth]
      operationId: signOut
      summary: End the current GBLOC authentication session
      responses:
        "200":
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthActionResponse"
  /auth/google/start:
    get:
      tags: [auth]
      operationId: startGoogleAuth
      summary: Redirect to Google OAuth
      responses:
        "302":
          description: Redirect to Google's authorization page.
  /auth/google/callback:
    get:
      tags: [auth]
      operationId: finishGoogleAuth
      summary: Complete Google OAuth
      responses:
        "302":
          description: Redirect to the app after OAuth.
  /profiles/me:
    get:
      tags: [profiles]
      operationId: getMyProfile
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: Profile and its social links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileWithLinks"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The plan's profile link limit has been reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [profiles]
      operationId: updateMyProfile
      summary: Update profile settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid profile data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The signed-in account has no profile to confirm against.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Username is already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /profiles/username-availability:
    get:
      tags: [profiles]
      operationId: checkUsernameAvailability
      summary: Check whether a username can be claimed
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 20
            pattern: "^[A-Za-z0-9_]{3,20}$"
      responses:
        "200":
          description: Username availability result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"
  /profiles/me/links:
    put:
      tags: [profiles]
      operationId: replaceMyProfileLinks
      summary: Replace the signed-in user's profile links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileLinksInput"
      responses:
        "200":
          description: Updated profile links.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileLink"
        "400":
          description: Invalid links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /profiles/{username}:
    get:
      tags: [profiles]
      operationId: getPublicProfile
      summary: Get a public profile by username
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 20
            pattern: "^[A-Za-z0-9_]{3,20}$"
      responses:
        "200":
          description: Public profile and links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfileResponse"
        "404":
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /profiles/{username}/views:
    post:
      tags: [profiles]
      operationId: recordProfileView
      summary: Record a public profile view
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 20
            pattern: "^[A-Za-z0-9_]{3,20}$"
      responses:
        "200":
          description: Updated public view count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewCount"
        "404":
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /account/summary:
    get:
      tags: [account]
      operationId: getAccountSummary
      summary: Get account and profile status
      responses:
        "200":
          description: Account summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /membership/me:
    get:
      tags: [account]
      operationId: getMyMembership
      summary: Get the signed-in user's active membership
      responses:
        "200":
          description: Active membership or free plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipState"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /billing/config:
    get:
      tags: [billing]
      operationId: getBillingConfig
      summary: Get available membership checkout plans
      responses:
        "200":
          description: Plans available for checkout in this installation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingConfig"
  /billing/checkout:
    post:
      tags: [billing]
      operationId: createCheckoutSession
      summary: Create a one-time Basic membership checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout session URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          description: Invalid plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: An active subscription or Pro membership blocks Basic checkout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Billing is not configured for this installation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /billing/portal:
    post:
      tags: [billing]
      operationId: createBillingPortalSession
      summary: Create a customer portal session
      responses:
        "200":
          description: Customer portal URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPortalSession"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Paid subscription not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Billing is not configured for this installation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/memberships:
    get:
      tags: [reports]
      operationId: getMembershipList
      summary: List active gifted memberships for the owner
      responses:
        "200":
          description: Active memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipListResponse"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [reports]
      operationId: giftMembership
      summary: Gift a membership plan to a profile for a number of days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftMembershipInput"
      responses:
        "200":
          description: Membership gifted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftMembershipResult"
        "400":
          description: Invalid gift details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /account/email:
    get:
      tags: [account]
      operationId: getAccountEmail
      summary: Get the signed-in user's saved email
      responses:
        "200":
          description: Saved email state for the signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEmailState"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /account/email/sync:
    post:
      tags: [account]
      operationId: syncAccountEmail
      summary: Store the signed-in user's verified primary email
      responses:
        "200":
          description: Saved verified email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEmailState"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: No verified primary email is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Email could not be verified with the identity provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /account/deletion:
    get:
      tags: [account]
      operationId: getAccountDeletionStatus
      summary: Get status of an older deletion request
      description: Reports requests created before the immediate-deletion flow was introduced.
      responses:
        "200":
          description: Current account deletion status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionStatus"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [account]
      operationId: requestAccountDeletion
      summary: Permanently delete account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionInput"
      responses:
        "200":
          description: Account and associated data permanently deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResult"
        "400":
          description: Permanent deletion confirmation is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Deletion could not be completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [account]
      operationId: cancelAccountDeletion
      summary: Cancel an older pending deletion request
      description: Only applies to requests submitted before immediate deletion was introduced. New confirmed deletions cannot be canceled.
      deprecated: true
      responses:
        "200":
          description: Deletion request canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionStatus"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No cancellable deletion request exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The deletion process has already started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /reports:
    post:
      tags: [reports]
      operationId: createProfileReport
      summary: Report a public profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileReportInput"
      responses:
        "201":
          description: Report submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileReportResponse"
        "400":
          description: Invalid report or own profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: An open report already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /legal/terms:
    get:
      tags: [legal]
      operationId: getPublishedTerms
      summary: Get the published terms of service
      responses:
        "200":
          description: Published terms of service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsDocument"
        "404":
          description: Terms have not been published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /legal/privacy:
    get:
      tags: [legal]
      operationId: getPrivacyPolicy
      summary: Get the privacy policy
      responses:
        "200":
          description: Privacy policy for account email data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyPolicyDocument"
  /admin/legal/terms:
    get:
      tags: [legal]
      operationId: getAdminTerms
      summary: Get terms draft and publication status for the owner
      responses:
        "200":
          description: Editable terms content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTermsDocument"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      tags: [legal]
      operationId: publishTerms
      summary: Publish revised terms for the owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermsDocumentInput"
      responses:
        "200":
          description: Published terms with automatically assigned effective time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsDocument"
        "400":
          description: Invalid terms content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/legal/privacy:
    get:
      tags: [legal]
      operationId: getAdminPrivacyPolicy
      summary: Get privacy policy draft and publication status for the owner
      responses:
        "200":
          description: Editable privacy policy content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPrivacyPolicyDocument"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      tags: [legal]
      operationId: publishPrivacyPolicy
      summary: Publish revised privacy policy for the owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyPolicyInput"
      responses:
        "200":
          description: Published privacy policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPrivacyPolicyDocument"
        "400":
          description: Invalid privacy policy content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /moderation/access:
    get:
      tags: [reports]
      operationId: getModeratorAccess
      summary: Check whether the signed-in user can moderate reports
      responses:
        "200":
          description: Moderator access state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeratorAccessResponse"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /moderation/reports:
    get:
      tags: [reports]
      operationId: getModerationReports
      summary: List profile reports for moderators
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, new, reviewing, dismissed, actioned]
            default: new
      responses:
        "200":
          description: Moderation reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReportListResponse"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Moderator access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /moderation/reports/{reportId}:
    patch:
      tags: [reports]
      operationId: updateModerationReport
      summary: Update a report and its profile visibility
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F-]{36}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationReportUpdateInput"
      responses:
        "200":
          description: Updated moderation report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReportUpdateResponse"
        "400":
          description: Invalid moderation action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Moderator access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Report not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /moderation/moderators:
    get:
      tags: [reports]
      operationId: getModeratorList
      summary: List active profile moderators for the owner
      responses:
        "200":
          description: Active moderators.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeratorListResponse"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [reports]
      operationId: addModerator
      summary: Add a profile moderator by verified email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddModeratorInput"
      responses:
        "201":
          description: Moderator added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeratorCreateResult"
        "400":
          description: Invalid email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Moderator already exists or is the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /moderation/moderators/{moderatorId}:
    delete:
      tags: [reports]
      operationId: removeModerator
      summary: Remove a profile moderator
      parameters:
        - name: moderatorId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F-]{36}$"
      responses:
        "200":
          description: Moderator access removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeratorRemovalResult"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Owner access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Moderator not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a signed URL for uploading a profile asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Signed upload URL and object path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/complete:
    post:
      tags: [Storage]
      operationId: completeUpload
      summary: Mark an uploaded profile asset as publicly available
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompleteInput"
      responses:
        "200":
          description: Upload is now ready to use in a public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCompleteResponse"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Upload not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a stored profile asset
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored object bytes.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
